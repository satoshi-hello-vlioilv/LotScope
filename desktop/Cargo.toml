[package]
name = "defect-analyzer-desktop"
version = "3.111.0"
description = "LotScope（仕掛・作業実績・品質の見える化）デスクトップ版の窓"
edition = "2021"
rust-version = "1.90"
publish = false

# exe の名前は program/app/brand.json の exe と同じ（tests/test_brand.py が食い違いを止める）
# 窓に依らない処理（一覧・写し・Python と同じ書き方）。試験（tests/）からも使う
[lib]
name = "da_core"
path = "src/lib.rs"

[[bin]]
name = "LotScope"
path = "src/main.rs"

[features]
# 起動画面を exe に埋め込む本番の形。外すと Tauri の開発の形になる
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
# 品質データ（SQLite）を引く（src/lotlist.rs）。SQLite は exe に入れる（どの PC でも同じ版・窓関数が使える）
rusqlite = { version = "0.37", features = ["bundled", "functions", "backup"] }
# 更新: 配る ZIP を展開する・指紋（SHA-256）を確かめる（src/update.rs）
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.10"
# 「N 日以内」の今日（この PC の暦）
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# 計算列の式（src/formula.rs。画面の list-formula.js と同じ答え）: 利用者が書く JavaScript の正規表現（後方参照・先読みも）・
# hankaku の NFKC・日時の読み方。regex は Tauri が既に使っている版と同じ物（同じ crate を2つ持たない）
fancy-regex = "0.14"
unicode-normalization = "0.1"
regex = "1"
# 画面の CSP の印（版 3.85.0。src/page.rs。secrets.token_urlsafe と同じ暗号の乱数。Tauri が既に使っている版）
getrandom = "0.3"

# 本物の Python を PID で見る・止める（src/proc.rs）・ショートカットを作る（src/lnk.rs）。版は Tauri が使っているものに合わせる（同じ crate を2つ持たない）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Threading", "Win32_System_Com", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming", "Win32_System_SystemInformation", "Win32_System_Diagnostics_Debug", "Win32_System_JobObjects", "Win32_Security"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# debug の窓でも、更新の取り込み・入れ替えの sha256 と ZIP の展開だけは最適化して組む（版 3.111.0）。opt-level 0 では 370 MB の debug の exe の
# sha256 が 1 回 7.4 秒・ZIP の展開が 10 秒かかり（最適化で 0.3 秒・2.3 秒）、窓の通し（verify.py）の場面ごとに Linux の CI で約 1.5 分を足していた
# （Windows の CI は release の exe で 10 秒）。待ちの長さ（確かめの上限など）は変えない。release は全体が opt-level 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.zip]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.zlib-rs]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3

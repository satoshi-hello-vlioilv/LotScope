# CLAUDE.md の「push 前の確かめ」を GitHub でも回す（型・構文・lint〔ruff・clippy〕・試験）。
# - program: アプリは Python の標準の部品だけで動く（版 3.8.0 で Flask を外した）ので、部品は入れずに試す（入れないこと自体が確かめ）
# - desktop: 窓（Rust・Tauri）の書式・作成・試験と、本物の窓（WebKitGTK）での自己診断（Windows の WebView2 は desktop.yml）
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.18"          # 修正版まで決める（版 3.98.0: html.parser の答えが修正版で替わる。焼いた表 tests/test_lotdsp_html_cases.py は Linux のここだけで流す）
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Ubuntu 24.04 は既定で、root でない人の名前空間（Chrome のサンドボックスが使う）を AppArmor で止めている。
      # 止まったままだと本物のブラウザの試験（test_lotdsp_direct.RealBrowser）で Chrome がすぐ終わるので外す。
      - name: Chrome のサンドボックスを使えるようにする
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: 型・構文（画面の JS・道具の JS）
        run: bash program/tools/js-check.sh   # import を使う .js はモジュールとして確かめる（CLAUDE.md と同じ）
      - name: 型・構文（Python）
        run: python -m compileall -q program
      # 手元と同じ版の ruff（版が変わると決まりが増えて、手元で通った物が落ちる）
      - name: lint（Python・ruff）
        run: |
          pip install ruff==0.15.20
          ruff check program
      - name: test（Python・アプリ）
        working-directory: program
        run: python -m unittest discover -s tests -t .
      - name: test（Python・配る ZIP の組み立て）
        run: python -m unittest discover -s desktop/bundle -t desktop/bundle

  desktop:
    runs-on: ubuntu-latest
    # 版 3.111.0 で 60 → 90 分: 窓の通しに 4b〜4e と Python の無い PC の通しを足し、更新の通しが約 44 分（場面ごとに debug の窓の自己診断が 2〜4 分）になって、
    # Rust の試験（約 11 分）・自己診断（約 3 分）と合わせて 60 分で切れた（PR #111。最後の段の Python の無い PC の通しは通った直後）。控えが効かないと組み立てで約 13 分増える。
    # 版 3.118.0 で 90 → 120 分: Rust の試験を 2 つの形（Python と比べる・表だけ）で流す（約 11 分増える）
    timeout-minutes: 120
    env:
      TPA_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.18"
      - name: 窓を作る部品（WebKitGTK）と画面の無い X
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev xvfb
      # 手元と同じ版（clippy は版が上がると決まりが増え、手元で通った物が落ちる）。上げるときは手元と一緒に上げる
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: lint（Rust の書式）
        working-directory: desktop
        run: cargo fmt --check
      - name: typecheck（Rust）
        working-directory: desktop
        run: cargo build --locked
      # 版 3.118.3（作った後の採点の割れ 2）: 窓に遅くする口（desktop/src/slow.rs。feature testing の下だけ）が入っていない
      # （exe の中に口の印の字が無い・組んだ記録の features に testing が無い。配る release の exe は desktop.yml の windows-exe で同じ物を見る）
      - name: 窓に遅くする口が無い
        run: |
          (cd desktop && cargo build --locked --message-format=json > "$RUNNER_TEMP/build.json")
          # exe の名前は program/app/brand.json の 1 か所（Linux は .exe を外す）
          EXE=$(python -c "import json;print(json.load(open('program/app/brand.json', encoding='utf-8'))['exe'].removesuffix('.exe'))")
          python program/tools/slow-hook-check.py --exe "desktop/target/debug/$EXE" --build-json "$RUNNER_TEMP/build.json"
      - name: lint（Rust・clippy）
        working-directory: desktop
        run: cargo clippy --locked --all-targets -- -D warnings
      # --no-fail-fast: 落ちた本で止めず、全部の本を流す（落ちた所を 1 回の CI で全部見る。落ちた本があれば終了コードは 0 でない。
      # 版 3.115.0 の PR #115 は、最初に落ちた本で止まるので落ちる所が 1 回に 1 つずつしか分からず、4 往復になった）
      # Python と比べる形（環境変数なし。CLAUDE.md の「push 前の確かめ」の命令そのまま。段 ⑤ まで残す）
      - name: test（Rust・Python と比べる形）
        working-directory: desktop
        run: cargo test --locked --no-fail-fast
      # 版 3.118.0（段 ④。採点の first_fixes 9）: 表だけの形も流す（TPA_NO_PYTHON=1: 焼いた本は表の宣言から場面を作り焼いた答えと比べる・
      # TPA_FROZEN_PY=1: 凍らせた Python を相手にする試験は凍らせた写し program/tests/legacy/3.117.3 を相手に流す）。check-all.sh も両方
      - name: test（Rust・表だけの形）
        if: ${{ !cancelled() }}
        working-directory: desktop
        env:
          TPA_NO_PYTHON: "1"
          TPA_FROZEN_PY: "1"
        run: cargo test --locked --no-fail-fast
      # 自己診断（desktop/src/selftest.js。版 3.118.1 から項目は全部窓だけの確かめ: 答えの形・道どうしの数・場面の値・決めた答え。中身〈Python〉とは比べない）。
      # 一覧の数を道どうしで見るため、試験用の品質データ（3000 行）を参照先にした設定で起こす
      - name: 自己診断（本物の窓・WebKitGTK）
        run: |
          python program/tests/lotlist_fixture.py "$RUNNER_TEMP/q.sqlite3" 3000
          python program/tests/selftest_config.py "$RUNNER_TEMP/q.sqlite3" "$RUNNER_TEMP/appsettings.json"
          export TRANSFER_APP_CONFIG="$RUNNER_TEMP/appsettings.json"
          export TRANSFER_LOCAL_ROOT="$RUNNER_TEMP/root" TPA_SELFTEST="$RUNNER_TEMP/selftest.json"
          exe="$(python -c "import json;print(json.load(open('program/app/brand.json',encoding='utf-8'))['exe'][:-4])")"
          # 版 3.118.0（段 ④）: PATH に Python がある形のまま開く（窓は Python を探さない。起こそうとしたかは窓の記録で見る）
          cd "$RUNNER_TEMP" && timeout 240 xvfb-run -a "$GITHUB_WORKSPACE/desktop/target/debug/$exe" || true
          # 起こした印（採点の割れ 3）: 窓を閉じた記録の python_attempts が 0・中身を起こすと必ず作られる sidecar_stderr.log が無い
          grep "python_attempts=" "$RUNNER_TEMP/root/logs/desktop.log" || { echo "窓を閉じた記録（python_attempts）がありません"; exit 4; }
          if grep "python_attempts=" "$RUNNER_TEMP/root/logs/desktop.log" | grep -v "python_attempts=0" || [ -e "$RUNNER_TEMP/root/logs/sidecar_stderr.log" ]; then
            echo "Python を起こそうとしました（段 ④ の窓は起こさない）"; exit 4
          fi
          python - <<'PY'
          import json, os, sys
          path = os.environ["TPA_SELFTEST"]
          if not os.path.exists(path):
              sys.exit("結果のファイルがありません")
          r = json.load(open(path, encoding="utf-8"))
          for x in r.get("results", []):
              print("PASS" if x["ok"] else "FAIL", x["name"], "--", x["info"])
          if r.get("error"):
              print("ERROR:", r["error"])
          if r.get("python") != "absent":
              sys.exit(f"中身の様子が absent でありません（段 ④）: {r.get('python')}")
          # 版 3.118.1: 項目の数・飛ばした数・窓が答えなかった形を 1 行に。必ず出る項目（selftest_names.json）が欠ける・一覧に無い名前が出たら落とす
          names = json.load(open(os.path.join(os.environ["GITHUB_WORKSPACE"], "desktop/bundle/selftest_names.json"), encoding="utf-8"))["items"]
          need = [x["name"] for x in names if "maybe" not in x]
          known = {x["name"] for x in names}
          got = [x["name"] for x in r.get("results", [])]
          una = (r.get("info") or {}).get("unanswered")
          print(f"SELFTEST n={len(got)} need={len(need)} skipped={r.get('skipped')} unanswered={json.dumps(una, ensure_ascii=False)}")
          lack = [n for n in need if n not in got]
          extra = [n for n in got if n not in known]
          if lack or extra or r.get("skipped") != 0:
              print("無い項目:", lack)
              print("一覧に無い名前:", extra)
              sys.exit(6)
          sys.exit(0 if r.get("ok") else 1)
          PY
      # 更新の通し（desktop/bundle/verify.py）: 共有から写る → 裏で取り込む → 次の起動で入れ替わる → 閉じている間に置いた版に 1 回の起動で入れ替わる → 壊れた版は控えへ戻す → 配る版を戻す
      - name: 更新の通し（本物の窓・WebKitGTK）
        run: xvfb-run -a python desktop/bundle/verify.py update --exe desktop/target/debug/$(python desktop/bundle/bundle.py brand exe | sed 's/\.exe$//') --work "$RUNNER_TEMP/verify"
      # Python の無い PC（版 3.111.0）: 作業場所の窓だけを、TPA_PYTHON を無い道・PATH から Python を外して開く → 画面を開き、窓だけの自己診断の項目が通る。
      # 版 3.118.0 から更新の通し（update）も窓を Python の無い PATH で開き、窓の記録に中身を起こした印が 1 度も無いことを見る
      - name: Python の無い PC の通し（本物の窓・WebKitGTK）
        run: xvfb-run -a python desktop/bundle/verify.py local --exe desktop/target/debug/$(python desktop/bundle/bundle.py brand exe | sed 's/\.exe$//') --work "$RUNNER_TEMP/verify-local"
      - name: 記録
        if: always()
        run: tail -n 40 "$RUNNER_TEMP"/root/logs/*.log || true

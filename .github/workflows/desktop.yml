# デスクトップ版（desktop/・Tauri）を Windows で確かめる。仕事は 2 つ（版 3.117.0 で 1 つの仕事 windows を割った。並んで流れる）:
# - windows-test: Rust の試験（cargo test。debug）と、Windows の本物で流す Python の試験・焼いた表との違いの測り（測るだけ）
# - windows-exe: 本番の作り方（--release）で exe を作り、本物の WebView2 で自己診断し、更新の通し（verify.py）を流して、
#   通った exe・配る ZIP（release.json・.sha256 つき）・自己診断の結果を Artifacts（desktop-windows）に置く
# main に入ったとき（と手で全部を動かしたとき）は、両方が通った後に、確かめ終えた配る ZIP を GitHub の Releases にも版の札（v<版>）で載せる（release）。
# 割った訳: 1 つの仕事は約 80 分（cargo test 約 40 分〈route_reach だけで約 19 分〉・release の組み立て 6 分・自己診断 3 分・更新の通し 約 28 分）で、
# 上限 90 分に余りが約 10 分しか無かった（PR #116）。試験（debug）と exe（release）は別の組み立てなので、割っても組み直しは増えない
# （取り出しと道具の支度が 2 回になるだけ）。見込みは windows-test 約 55 分（cargo test 約 44 分＋表だけの形の測り 約 10 分）・windows-exe 約 39 分。
name: desktop

on:
  pull_request:
    paths: ["desktop/**", "program/**", ".github/workflows/desktop.yml"]
  push:
    branches: [main]
    paths: ["desktop/**", "program/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:
    inputs:
      only:
        description: "流す仕事（all: 全部。windows-test: Rust の試験と測りだけ。exe・更新の通し・Releases は流さない）"
        type: choice
        options: [all, windows-test]
        default: all

permissions:
  contents: read

jobs:
  # Rust の試験（debug）と、Windows の本物で流す Python の試験。exe は作らない（windows-exe）
  windows-test:
    # 上限は割る前と同じ 90 分（見込みは約 55 分: cargo test 約 44 分＋表だけの形の測り 約 10 分〈Python と比べる形の焼いた本の試験の計 約 600 秒から〉。rust-cache の鍵〈Cargo.toml・Cargo.lock〉が変わった版は全部を組み直して数分増える）
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONIOENCODING: utf-8
      TPA_PYTHON: python
      # exe が名乗る「作ったコミット」（/__desktop/info の commit）
      TPA_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"          # Windows の機械には 3.13.18 がまだ無い（3.13.17 まで）。焼いた html.parser の表はこの job で流さず、LotDsp は窓が読むので修正版を決めない
      # 手元・ci.yml と同じ版（版 3.104.0。stable のままだと Rust 1.100.0 で std の Unicode の大文字の表が新しくなり、
      # Python 3.13 と比べる name_key_cases が落ちた）。上げるときは手元・ci.yml と一緒に上げ、key-split-table.py で表を焼き直す
      - uses: dtolnay/rust-toolchain@1.97.0
      # 組んだ物の控え。鍵には仕事の名前が自動で入る（rust-cache の既定）ので、windows-test は debug・windows-exe は release を別々に持つ
      # （割る前の仕事 windows の控えは鍵が違うので使われない。割った後の最初の 1 回は両方とも空から組む）
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      # --no-fail-fast: 落ちた本で止めず、全部の本を流す（ci.yml と同じ。落ちた本があれば終了コードは 0 でない）
      # TPA_MEASURE（版 3.116.0。測るだけ）: 焼いた表（desktop/tests/baked。posix の窓の答え）と Windows の窓の答えが違う歩を、試験を落とさずに
      # 数えて残す（desktop/tests/common/bake.rs。Windows は ④ まで Windows の Python と比べ、表とは比べない）。数は下の段が出し、成果物にも置く。
      # この段は Python と比べる形（Windows の Python が場面を作る）。表だけの形は 2 つ下の段
      # 版 3.117.1（段 ③-6）: CM3 の https の作り物の CA（program/tests/fixtures/tls/ca.pem）を LocalMachine\Root に入れる。窓の TLS（schannel）は
      # Windows の証明書ストアだけを見る（Python の ssl は SSL_CERT_FILE も見る）。schedule_parity の https の場面が schannel の本物の検証で
      # 作り物の CM3 に届き、入れていない CA・名前の違う証明書・TLS でない口が cm3_net_cases.json の 3 つの種類に分かれるかを見る。
      # 終わりの段（if: always()）で必ず外す（後ろの仕事に残さない。windows-exe は別の機械）
      - name: 作り物の CA を証明書ストアに入れる（TLS の試験の間だけ）
        run: |
          $ca = Join-Path $env:GITHUB_WORKSPACE "program\tests\fixtures\tls\ca.pem"
          certutil -f -addstore Root $ca
          if ($LASTEXITCODE -ne 0) { throw "作り物の CA を Root に入れられませんでした（certutil の終了コード $LASTEXITCODE）" }
          $tp = (New-Object System.Security.Cryptography.X509Certificates.X509Certificate2 $ca).Thumbprint
          $c = Get-ChildItem Cert:\LocalMachine\Root | Where-Object { $_.Thumbprint -eq $tp }
          if (-not $c) { throw "Root に作り物の CA（$tp）が見えません" }
          Write-Host "入れた CA: $($c.Thumbprint) $($c.Subject)"
      # 版 3.118.0（段 ④。採点の first_fixes 9）: Python と比べる形の cargo test と、その形の測りは外した。窓の試験は表だけの形
      # （TPA_NO_PYTHON=1・凍らせた Python の写しを相手にする TPA_FROZEN_PY=1）が標準。焼いた本の試験は下の 2 段（札が table の本は表と比べて落とす・
      # measure の本は測るだけ）、それ以外の試験（--lib --bins と本でない tests/*.rs。bless.py --nonbook-args）はこの段で落とす
      - name: test（Rust・Windows・表だけの形。焼いた本でない試験）
        working-directory: desktop
        env:
          TPA_NO_PYTHON: "1"
          TPA_FROZEN_PY: "1"
        run: |
          $a = (python ..\program\tools\bless.py --nonbook-args) -split ' '
          cargo test --locked --no-fail-fast @a
      # 表だけの形（版 3.117.0 から測り、版 3.117.3 から比べる）: 焼いた本の試験だけを TPA_NO_PYTHON=1（段 ④ の後の形。Python を呼ばず、
      # 表の宣言から場面を作って焼いた答えと比べる）でもう 1 回流す。上の形は Windows の Python が場面を作るので、④ の後に残る形で
      # Windows が通るかは、この 2 段でしか分からない。本は books.json の windows の札で 2 つに分ける:
      # - table: 焼いた表（posix の答えに desktop/tests/baked/nt/<表>.json の Windows の上書きを重ねた形）と比べて落とす（この段は落ちたら落ちる）
      # - measure: まだ測るだけ（落ちても続ける）。測りの記録（違う歩の Windows の答え got・流さない歩・作れない場面の物）は仕事の終わりの段が
      #   「measure-z| 」の行で記録に出し、python program/tools/bless.py --take-nt 記録 で nt の表に取り込むと札が table になる
      # route_reach は長い（Windows で約 19 分）ので流さない（答えは数だけで、歩を表に持たない）。組み直しは無い（上の段と同じ debug）
      - name: 焼いた本を表だけの形（TPA_NO_PYTHON=1）で表と比べる（札が table の本。落ちたら落ちる）
        # 手で取り消したときは流さない（版 3.117.3 の作った後の直し・割れ 4 (d)。上の cargo test が落ちても流す）
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: python program/tools/bless.py --no-python --frozen --all --windows table --skip-test route_reach
      - name: 焼いた本を表だけの形（TPA_NO_PYTHON=1）で流す（札が measure の本。測るだけ・落ちても続ける）
        if: always()
        continue-on-error: true
        timeout-minutes: 20
        env:
          TPA_MEASURE: ${{ runner.temp }}\bake-measure-table
        run: python program/tools/bless.py --no-python --frozen --all --windows measure --skip-test route_reach
      # 2 つの形の数を別の行で出す（記録そのものは仕事の終わりの段が詰めた行で出す）
      - name: 焼いた表（posix）と Windows の窓の答えの違いを数える（測るだけ・落とさない）
        if: always()
        continue-on-error: true
        run: python program/tools/bless.py --measured "$env:RUNNER_TEMP\bake-measure-table"
      # 版 3.117.1（段 ③-6）: Windows の本物の設定で、窓のプロキシの読み手（src/sysproxy.rs のレジストリの読み）と Windows の Python の
      # urllib.request.getproxies・proxy_bypass が同じ答えか。HKCU の Internet Settings の ProxyEnable・ProxyServer・ProxyOverride・AutoConfigURL を
      # 書いて比べ、終わったら必ず元に戻す（finally と下の always の段）。落ちたときは期待した値と来た値を記録に出す（手元では流せない段）。
      # PAC の一言は Windows の Python の app の sysproxy.pac_note（winreg を本当に読む）と窓の pac_note を比べる（版 3.117.1 の作った後の直し・割れ 6）。
      # 事例の表（sysproxy_cases.json。どの事例も posix と nt の答え。urllib の本物の関数に作り物の winreg を当てる）と言葉の表も Windows の Python で流す
      # （表の試験は os.environ を事例の dict に差し替えるので、Windows の os.environ が名前を大文字にしても答えは変わらない。割れ 1）
      - name: TLS とプロキシを Windows の本物で（③-6）
        if: always()
        working-directory: desktop
        run: |
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings"
          $names = "ProxyEnable", "ProxyServer", "ProxyOverride", "AutoConfigURL"
          $saved = @{}
          foreach ($n in $names) { $v = Get-ItemProperty -Path $key -Name $n -ErrorAction SilentlyContinue; if ($v) { $saved[$n] = $v.$n } }
          $saved | ConvertTo-Json | Set-Content -Path "$env:RUNNER_TEMP\proxy-saved.json"
          Write-Host "前の設定: $($saved | ConvertTo-Json -Compress)"
          Get-ChildItem env: | Where-Object { $_.Name -like "*_proxy" } | ForEach-Object { Remove-Item "env:$($_.Name)" }
          try {
            Set-ItemProperty -Path $key -Name ProxyEnable -Value 1 -Type DWord
            Set-ItemProperty -Path $key -Name ProxyServer -Value "http=hp.corp.example:8080;https=sp.corp.example:8443"
            Set-ItemProperty -Path $key -Name ProxyOverride -Value "<local>; *.CORP.example ;10.*"
            Remove-ItemProperty -Path $key -Name AutoConfigURL -ErrorAction SilentlyContinue
            $env:TPA_SYSPROXY_REAL = "1"
            cargo test --locked --test sysproxy_cases -- --ignored --nocapture
            if ($LASTEXITCODE -ne 0) { throw "窓のプロキシの読み手（getproxies・proxy_bypass・PAC の一言）が Windows の Python と違う（上の記録の 期待/来た を見る）" }
            Set-ItemProperty -Path $key -Name ProxyEnable -Value 0 -Type DWord
            Set-ItemProperty -Path $key -Name AutoConfigURL -Value "http://wpad.corp.example/proxy.pac"
            $env:TPA_SYSPROXY_REAL = "pac"
            cargo test --locked --test sysproxy_cases -- --ignored --nocapture
            if ($LASTEXITCODE -ne 0) { throw "PAC の一言（ProxyEnable 0・AutoConfigURL あり）が Windows の Python の pac_note（winreg の読み）と違う（上の記録の 期待/来た を見る）" }
          } finally {
            foreach ($n in $names) {
              if ($saved.ContainsKey($n)) { Set-ItemProperty -Path $key -Name $n -Value $saved[$n] } else { Remove-ItemProperty -Path $key -Name $n -ErrorAction SilentlyContinue }
            }
            Write-Host "設定を元に戻しました"
          }
          Push-Location ..\program
          python -m unittest tests.test_sysproxy_cases tests.test_cm3_net_cases -v
          if ($LASTEXITCODE -ne 0) { throw "事例の表（Windows の Python）" }
          Pop-Location
      # 作り物の CA を外し、プロキシの設定が残っていれば戻す（どの段で落ちても流す）
      - name: 作り物の CA とプロキシの設定を片付ける
        if: always()
        run: |
          $tp = (New-Object System.Security.Cryptography.X509Certificates.X509Certificate2 (Join-Path $env:GITHUB_WORKSPACE "program\tests\fixtures\tls\ca.pem")).Thumbprint
          $c = Get-ChildItem Cert:\LocalMachine\Root | Where-Object { $_.Thumbprint -eq $tp }
          foreach ($x in $c) { certutil -delstore Root $x.Thumbprint | Out-Null; Write-Host "外した CA: $($x.Thumbprint)" }
          $left = Get-ChildItem Cert:\LocalMachine\Root | Where-Object { $_.Thumbprint -eq $tp }
          if ($left) { throw "作り物の CA が残っています" }
          $saved = "$env:RUNNER_TEMP\proxy-saved.json"
          if (Test-Path $saved) {
            $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings"
            $v = Get-Content $saved -Raw | ConvertFrom-Json
            foreach ($n in "ProxyEnable", "ProxyServer", "ProxyOverride", "AutoConfigURL") {
              if ($v -and ($v.PSObject.Properties.Name -contains $n)) { Set-ItemProperty -Path $key -Name $n -Value $v.$n } else { Remove-ItemProperty -Path $key -Name $n -ErrorAction SilentlyContinue }
            }
            Write-Host "プロキシの設定: $(Get-ItemProperty -Path $key | Select-Object ProxyEnable, ProxyServer, ProxyOverride, AutoConfigURL | ConvertTo-Json -Compress)"
          }
      # 写しの係（Python 版）が、共有の書き手（DataRelay の os.replace による公開）を止めないか。Windows の本物の規則で
      # （開いているファイルは置き換えられない。Rust 版は上の cargo test の tests/mirror_writer.rs）
      - name: 写しと公開の干渉（Python・Windows）
        if: always()
        working-directory: program
        run: python -m unittest tests.test_mirror_writer -v
      # 結合・スケジュールを Windows の本物の SQLite で（URI を既定で読まない。版 3.57.1 で、Linux の試験だけでは気づけなかった）
      - name: 結合・スケジュール（Python・Windows）
        if: always()
        working-directory: program
        run: python -m unittest tests.test_data_join tests.test_schedule tests.test_mirror_share tests.test_cm3_timeout -v
      # 置き場と設定の事例の表（版 3.100.0）を Windows の本物で: 隠し・システムの属性を「参照…」に出さない・ドライブだけの「C:」・
      # 書けるかを試しのフォルダで見る・Windows の道の字（窓の normcase と Python の ntpath.normcase は上の cargo test の place_cases）
      - name: 置き場と設定の事例（Python・Windows）
        if: always()
        working-directory: program
        run: python -m unittest tests.test_place_cases -v
      # 壊れた設定・マスタと設備グループの正規表現（版 3.102.0）を Windows の本物で: BOM 付きの配った設定・途中で切れたマスタ・表でない行・
      # 正規表現の事例の表（Python の re。窓の fancy-regex は上の cargo test の equip_regex_cases・束の節は bundle_cases）
      - name: 壊れた設定・マスタと正規表現の事例（Python・Windows）
        if: always()
        working-directory: program
        run: python -m unittest tests.test_broken_masters tests.test_equip_regex tests.test_bundle_sections -v
      # 測りの記録（形ごとのフォルダの <表>.json）は小さな成果物（desktop-windows-measure）に置く。配る物の成果物（desktop-windows。windows-exe）とは別
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-windows-measure
          path: |
            ${{ runner.temp }}/bake-measure-table/
          if-no-files-found: warn
      # 表だけの形の測りの記録そのもの（版 3.117.3）を、仕事の記録の終わりに詰めた行（「measure-z| 」。zlib・base64 を 2,000 字ずつ）で出す。
      # 成果物を取れない所でも、記録の末尾（行と字の上限がある）からこの段だけを取れば取り込める:
      # python program/tools/bless.py --take-nt 記録（nt の表を書き、本の表のどれもが取り込めた本の札を table にする）。
      # 3.117.2 の測りの量（表だけの形 17 表の違う歩・答えない歩）で 63 行・約 6.6 万字（生 469 KB）。PR #119 の記録は 2,401 行
      - name: 表だけの形の測りの記録を詰めた行で出す（--take-nt で取り込む）
        if: always()
        continue-on-error: true
        run: python program/tools/bless.py --emit "$env:RUNNER_TEMP\bake-measure-table"

  # 本番の作り方（--release）の exe・本物の WebView2 の自己診断・更新の通し・配る ZIP。手で windows-test だけを選んだときは流さない
  windows-exe:
    if: github.event_name != 'workflow_dispatch' || inputs.only != 'windows-test'
    # 上限は割る前と同じ 90 分（見込みは約 39 分: release の組み立て 6 分・自己診断 3 分・更新の通し 約 28 分）
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONIOENCODING: utf-8
      TPA_PYTHON: python
      # exe が名乗る「作ったコミット」（/__desktop/info の commit）
      TPA_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"          # Windows の機械には 3.13.18 がまだ無い（3.13.17 まで）。焼いた html.parser の表はこの job で流さず、LotDsp は窓が読むので修正版を決めない
      # 手元・ci.yml と同じ版（版 3.104.0。stable のままだと Rust 1.100.0 で std の Unicode の大文字の表が新しくなり、
      # Python 3.13 と比べる name_key_cases が落ちた）。上げるときは手元・ci.yml と一緒に上げ、key-split-table.py で表を焼き直す
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: exe を作る
        working-directory: desktop
        run: cargo build --release --locked
      # exe の名前は program/app/brand.json の1か所（ここには書かない）
      - name: exe の名前
        run: '"EXE=" + (Get-Content program/app/brand.json -Raw -Encoding utf8 | ConvertFrom-Json).exe | Out-File -Append -Encoding utf8 $env:GITHUB_ENV'
      # 異常ロット一覧を Rust と Python で引き比べるため、試験用の品質データ（3000 行）を参照先にした設定で起こす
      - name: 自己診断（本物の WebView2・ポートなし）
        run: |
          python program\tests\lotlist_fixture.py "$env:RUNNER_TEMP\q.sqlite3" 3000
          python program\tests\selftest_config.py "$env:RUNNER_TEMP\q.sqlite3" "$env:RUNNER_TEMP\appsettings.json"
          $env:TRANSFER_APP_CONFIG = "$env:RUNNER_TEMP\appsettings.json"
          $env:TRANSFER_LOCAL_ROOT = "$env:RUNNER_TEMP\root"
          $env:TPA_SELFTEST = "$env:RUNNER_TEMP\selftest.json"
          # 版 3.118.0（段 ④。採点の first_fixes 9）: 窓を起こすときだけ PATH から Python を外し、TPA_PYTHON を無い道にする（道具の Python は残す）
          $keepPath = $env:PATH
          $env:PATH = (python desktop\bundle\verify.py --no-python-path)
          $env:TPA_PYTHON = "$env:RUNNER_TEMP\どこにも無い\python.exe"
          $before = @(Get-Process python, py -ErrorAction SilentlyContinue | ForEach-Object { $_.Id })
          Start-Process -FilePath "desktop\target\release\$env:EXE" -WorkingDirectory $env:RUNNER_TEMP
          $started = @()
          $deadline = (Get-Date).AddSeconds(240)
          while (-not (Test-Path $env:TPA_SELFTEST) -and (Get-Date) -lt $deadline) {
            $started += @(Get-Process python, py -ErrorAction SilentlyContinue | Where-Object { $before -notcontains $_.Id } | ForEach-Object { "$($_.Id) $($_.Path)" })
            Start-Sleep -Seconds 2
          }
          Wait-Process -Name ([IO.Path]::GetFileNameWithoutExtension($env:EXE)) -Timeout 30 -ErrorAction SilentlyContinue
          $env:PATH = $keepPath
          Remove-Item env:TPA_PYTHON
          Get-ChildItem "$env:TRANSFER_LOCAL_ROOT\logs" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content $_.FullName -Tail 25 -Encoding utf8 }
          # 起動の時間（版 3.86.0）: 画面を開いた時刻（OPEN ms）。版 3.118.0 から中身の準備（READY）は無い
          Get-ChildItem "$env:TRANSFER_LOCAL_ROOT\logs\desktop.log" -ErrorAction SilentlyContinue | Select-String -Pattern "START program|OPEN |READY |BACKEND " | ForEach-Object { Write-Host "TIMING $($_.Line)" }
          # Python が 1 度も起きていない（版 3.118.0）: 窓の記録に中身を起こした印（READY・PID）が無く、走っている間に新しい Python のプロセスが無い
          $py = Get-ChildItem "$env:TRANSFER_LOCAL_ROOT\logs\desktop.log" -ErrorAction SilentlyContinue | Select-String -Pattern " READY version=| PID 起こした"
          if ($py -or $started) { Write-Host "Python が起きました（段 ④ の窓は起こさない）: $($py.Line) $($started -join ' / ')"; exit 4 }
          if (-not (Test-Path $env:TPA_SELFTEST)) { Write-Host "結果のファイルがありません"; exit 2 }
          $r = Get-Content $env:TPA_SELFTEST -Raw -Encoding utf8 | ConvertFrom-Json
          $r.results | ForEach-Object { Write-Host ("{0}: {1} -- {2}" -f ($(if ($_.ok) { "PASS" } else { "FAIL" })), $_.name, $_.info) }
          if ($r.error) { Write-Host "ERROR: $($r.error)" }
          Start-Sleep -Seconds 3
          if (-not $r.ok) { exit 1 }
          if ($r.python -ne "absent") { Write-Host "中身の様子が absent でありません: $($r.python)"; exit 5 }
      # 更新の通し（desktop/bundle/verify.py）: 共有から写る → 裏で取り込む → 次の起動で入れ替わる → 閉じている間に置いた版に 1 回の起動で入れ替わる → 壊れた版は控えへ戻す → 配る版を戻す
      - name: 更新の通し（本物の WebView2）
        run: python desktop\bundle\verify.py update --exe "desktop\target\release\$env:EXE" --work "$env:RUNNER_TEMP\verify"
      # 前の版と新しい版の境（版 3.118.0。採点の first_fixes 10・14）: GitHub の Releases のいちばん新しい札（v3.117.x。Python を起こす前の版）の
      # 配る ZIP を取り、その本物の窓で始めた PC が、いまの版を取り込み・入れ替え・開き直す（Python の無い PATH）、配る版を前の版へ戻すと前の版で開く
      - name: 前の版の窓から取り込む・前の版へ戻す（本物の WebView2）
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = gh release list --limit 20 --json tagName --jq '[.[] | .tagName | select(startswith("v3.117."))][0]'
          if (-not $tag) { Write-Host "::error::Releases に v3.117.x がありません"; exit 1 }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\prev-zip" | Out-Null
          gh release download $tag --pattern "*-windows.zip" --dir "$env:RUNNER_TEMP\prev-zip"
          $zip = (Get-ChildItem "$env:RUNNER_TEMP\prev-zip\*-windows.zip" | Select-Object -First 1).FullName
          Write-Host "前の版: $tag $zip"
          python desktop\bundle\verify.py prev --old-zip "$zip" --exe "desktop\target\release\$env:EXE" --work "$env:RUNNER_TEMP\verify-prev"
      - name: 配る ZIP を作る
        run: python desktop\bundle\bundle.py build --exe "desktop\target\release\$env:EXE" --out "$env:RUNNER_TEMP\release"
      - name: 成果物をまとめる
        if: always()
        run: |
          $out = "$env:RUNNER_TEMP\out"
          New-Item -ItemType Directory -Force $out | Out-Null
          if (Test-Path "desktop\target\release\$env:EXE") { Copy-Item "desktop\target\release\$env:EXE" $out }
          if (Test-Path "$env:RUNNER_TEMP\selftest.json") { Copy-Item "$env:RUNNER_TEMP\selftest.json" $out }
          Get-ChildItem "$env:RUNNER_TEMP\release" -File -ErrorAction SilentlyContinue | Copy-Item -Destination $out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-windows
          path: ${{ runner.temp }}/out/
          if-no-files-found: warn

  # 確かめ終えた配る ZIP を GitHub の Releases に載せる（main だけ。PR では動かない）。説明はその版の更新履歴から作る（bundle.py notes）。
  # 2 つの仕事（windows-test・windows-exe）が両方通った後にだけ流れる（手で windows-test だけを選んだときは、windows-exe が流れないので流れない）。
  # 書き込みの権限はこの job にだけ渡す。同じ版の札が既にあれば上書きしない（版を上げずに入った変更。配った ZIP と指紋を変えない）。
  release:
    needs: [windows-test, windows-exe]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.18"
      - uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: out
      - name: Releases に載せる
        shell: bash
        run: |
          set -euo pipefail
          version=$(python desktop/bundle/bundle.py version)
          tag="v$version"
          read -r built zip < <(python -c 'import json; r = json.load(open("out/release.json", encoding="utf-8")); print(r["version"], r["zip"])')
          if [ "$built" != "$version" ]; then echo "::error::作った ZIP の版（$built）と program の版（$version）が違います"; exit 1; fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::warning::$tag は既に Releases にあります（上書きしません）。配る物を変えたときは版を上げてください。"
            exit 0
          fi
          python desktop/bundle/bundle.py notes --release out/release.json > notes.md
          gh release create "$tag" "out/$zip" "out/$zip.sha256" out/release.json \
            --target "$GITHUB_SHA" --title "版 $version" --notes-file notes.md --latest

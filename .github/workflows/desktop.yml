# デスクトップ版（desktop/・Tauri）を Windows で確かめる。仕事は 2 つ（版 3.117.0 で 1 つの仕事 windows を割った。並んで流れる）:
# - windows-test: Rust の試験（cargo test。debug）と、Windows の本物で流す Python の試験・焼いた表との違いの測り（測るだけ）
# - windows-exe: 本番の作り方（--release）で exe を作り、本物の WebView2 で自己診断し、更新の通し（verify.py）を流して、
#   通った exe・配る ZIP（release.json・.sha256 つき）・自己診断の結果を Artifacts（desktop-windows）に置く
# main に入ったとき（と手で全部を動かしたとき）は、両方が通った後に、確かめ終えた配る ZIP を GitHub の Releases にも版の札（v<版>）で載せる（release）。
# 割った訳: 1 つの仕事は約 80 分（cargo test 約 40 分〈route_reach だけで約 19 分〉・release の組み立て 6 分・自己診断 3 分・更新の通し 約 28 分）で、
# 上限 90 分に余りが約 10 分しか無かった（PR #116）。試験（debug）と exe（release）は別の組み立てなので、割っても組み直しは増えない
# （取り出しと道具の支度が 2 回になるだけ）。見込みは windows-test 約 44 分・windows-exe 約 39 分。
name: desktop

on:
  pull_request:
    paths: ["desktop/**", "program/**", ".github/workflows/desktop.yml"]
  push:
    branches: [main]
    paths: ["desktop/**", "program/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:
    inputs:
      only:
        description: "流す仕事（all: 全部。windows-test: Rust の試験と測りだけ。exe・更新の通し・Releases は流さない）"
        type: choice
        options: [all, windows-test]
        default: all

permissions:
  contents: read

jobs:
  # Rust の試験（debug）と、Windows の本物で流す Python の試験。exe は作らない（windows-exe）
  windows-test:
    # 上限は割る前と同じ 90 分（見込みは約 44 分。rust-cache の鍵〈Cargo.toml・Cargo.lock〉が変わった版は全部を組み直して数分増える）
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONIOENCODING: utf-8
      TPA_PYTHON: python
      # exe が名乗る「作ったコミット」（/__desktop/info の commit）
      TPA_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"          # Windows の機械には 3.13.18 がまだ無い（3.13.17 まで）。焼いた html.parser の表はこの job で流さず、LotDsp は窓が読むので修正版を決めない
      # 手元・ci.yml と同じ版（版 3.104.0。stable のままだと Rust 1.100.0 で std の Unicode の大文字の表が新しくなり、
      # Python 3.13 と比べる name_key_cases が落ちた）。上げるときは手元・ci.yml と一緒に上げ、key-split-table.py で表を焼き直す
      - uses: dtolnay/rust-toolchain@1.97.0
      # 組んだ物の控え。鍵には仕事の名前が自動で入る（rust-cache の既定）ので、windows-test は debug・windows-exe は release を別々に持つ
      # （割る前の仕事 windows の控えは鍵が違うので使われない。割った後の最初の 1 回は両方とも空から組む）
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      # --no-fail-fast: 落ちた本で止めず、全部の本を流す（ci.yml と同じ。落ちた本があれば終了コードは 0 でない）
      # TPA_MEASURE（版 3.116.0。測るだけ）: 焼いた表（desktop/tests/baked。posix の窓の答え）と Windows の窓の答えが違う歩を、試験を落とさずに
      # 数えて残す（desktop/tests/common/bake.rs。Windows は ④ まで Windows の Python と比べ、表とは比べない）。数は下の段が出し、成果物にも置く。
      # この段は Python と比べる形（Windows の Python が場面を作る）。表だけの形は 2 つ下の段
      - name: test（Rust・Windows）
        working-directory: desktop
        env:
          TPA_MEASURE: ${{ runner.temp }}\bake-measure
        run: cargo test --locked --no-fail-fast
      # 表だけの形でも測る（版 3.117.0。測るだけ・落とさない）: 焼いた本の試験だけを TPA_NO_PYTHON=1（段 ④ の後の形。Python を呼ばず、
      # 表の宣言から場面を作って焼いた答えと比べる）でもう 1 回流す。上の形は Windows の Python が場面を作るので、④ の後に残る形で
      # Windows が通るかは、この段の数でしか分からない。試験そのものは表（posix の答え）と比べて落ちる所があるので、段は落ちても続ける。
      # route_reach は長い（Windows で約 19 分）ので流さない（答えは数だけで、歩を表に持たない）。組み直しは無い（上の段と同じ debug）
      - name: 焼いた本を表だけの形（TPA_NO_PYTHON=1）で流す（測るだけ・落ちても続ける）
        if: always()
        continue-on-error: true
        timeout-minutes: 20
        env:
          TPA_MEASURE: ${{ runner.temp }}\bake-measure-table
        run: python program/tools/bless.py --no-python --all --skip-test route_reach
      # 2 つの形の数を別の行で出す。--json: 記録そのものも 1 表 1 行で出す（成果物の置き場に届かない所からは、この仕事の記録を
      # python program/tools/bless.py --from-log 記録 出力フォルダ で戻す。PR #116 では成果物を取れず、記録の出力から数えた）
      - name: 焼いた表（posix）と Windows の窓の答えの違いを数える（測るだけ・落とさない）
        if: always()
        continue-on-error: true
        run: python program/tools/bless.py --measured "$env:RUNNER_TEMP\bake-measure" "$env:RUNNER_TEMP\bake-measure-table" --json
      # 写しの係（Python 版）が、共有の書き手（DataRelay の os.replace による公開）を止めないか。Windows の本物の規則で
      # （開いているファイルは置き換えられない。Rust 版は上の cargo test の tests/mirror_writer.rs）
      - name: 写しと公開の干渉（Python・Windows）
        working-directory: program
        run: python -m unittest tests.test_mirror_writer -v
      # 結合・スケジュールを Windows の本物の SQLite で（URI を既定で読まない。版 3.57.1 で、Linux の試験だけでは気づけなかった）
      - name: 結合・スケジュール（Python・Windows）
        working-directory: program
        run: python -m unittest tests.test_data_join tests.test_schedule tests.test_mirror_share tests.test_cm3_timeout -v
      # 置き場と設定の事例の表（版 3.100.0）を Windows の本物で: 隠し・システムの属性を「参照…」に出さない・ドライブだけの「C:」・
      # 書けるかを試しのフォルダで見る・Windows の道の字（窓の normcase と Python の ntpath.normcase は上の cargo test の place_cases）
      - name: 置き場と設定の事例（Python・Windows）
        working-directory: program
        run: python -m unittest tests.test_place_cases -v
      # 壊れた設定・マスタと設備グループの正規表現（版 3.102.0）を Windows の本物で: BOM 付きの配った設定・途中で切れたマスタ・表でない行・
      # 正規表現の事例の表（Python の re。窓の fancy-regex は上の cargo test の equip_regex_cases・束の節は bundle_cases）
      - name: 壊れた設定・マスタと正規表現の事例（Python・Windows）
        working-directory: program
        run: python -m unittest tests.test_broken_masters tests.test_equip_regex tests.test_bundle_sections -v
      # 測りの記録（形ごとのフォルダの <表>.json）は小さな成果物（desktop-windows-measure）に置く。配る物の成果物（desktop-windows。windows-exe）とは別
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-windows-measure
          path: |
            ${{ runner.temp }}/bake-measure/
            ${{ runner.temp }}/bake-measure-table/
          if-no-files-found: warn

  # 本番の作り方（--release）の exe・本物の WebView2 の自己診断・更新の通し・配る ZIP。手で windows-test だけを選んだときは流さない
  windows-exe:
    if: github.event_name != 'workflow_dispatch' || inputs.only != 'windows-test'
    # 上限は割る前と同じ 90 分（見込みは約 39 分: release の組み立て 6 分・自己診断 3 分・更新の通し 約 28 分）
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONIOENCODING: utf-8
      TPA_PYTHON: python
      # exe が名乗る「作ったコミット」（/__desktop/info の commit）
      TPA_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"          # Windows の機械には 3.13.18 がまだ無い（3.13.17 まで）。焼いた html.parser の表はこの job で流さず、LotDsp は窓が読むので修正版を決めない
      # 手元・ci.yml と同じ版（版 3.104.0。stable のままだと Rust 1.100.0 で std の Unicode の大文字の表が新しくなり、
      # Python 3.13 と比べる name_key_cases が落ちた）。上げるときは手元・ci.yml と一緒に上げ、key-split-table.py で表を焼き直す
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: exe を作る
        working-directory: desktop
        run: cargo build --release --locked
      # exe の名前は program/app/brand.json の1か所（ここには書かない）
      - name: exe の名前
        run: '"EXE=" + (Get-Content program/app/brand.json -Raw -Encoding utf8 | ConvertFrom-Json).exe | Out-File -Append -Encoding utf8 $env:GITHUB_ENV'
      # 異常ロット一覧を Rust と Python で引き比べるため、試験用の品質データ（3000 行）を参照先にした設定で起こす
      - name: 自己診断（本物の WebView2・ポートなし）
        run: |
          python program\tests\lotlist_fixture.py "$env:RUNNER_TEMP\q.sqlite3" 3000
          python program\tests\selftest_config.py "$env:RUNNER_TEMP\q.sqlite3" "$env:RUNNER_TEMP\appsettings.json"
          $env:TRANSFER_APP_CONFIG = "$env:RUNNER_TEMP\appsettings.json"
          $env:TRANSFER_LOCAL_ROOT = "$env:RUNNER_TEMP\root"
          $env:TPA_SELFTEST = "$env:RUNNER_TEMP\selftest.json"
          Start-Process -FilePath "desktop\target\release\$env:EXE" -WorkingDirectory $env:RUNNER_TEMP
          $deadline = (Get-Date).AddSeconds(240)
          while (-not (Test-Path $env:TPA_SELFTEST) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          Wait-Process -Name ([IO.Path]::GetFileNameWithoutExtension($env:EXE)) -Timeout 30 -ErrorAction SilentlyContinue
          Get-ChildItem "$env:TRANSFER_LOCAL_ROOT\logs" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content $_.FullName -Tail 25 -Encoding utf8 }
          # 起動の時間（版 3.86.0）: 画面を開いた時刻（OPEN ms）と中身の準備（READY spawn_ms）。Windows の WebView2 と同梱でない Python での数を残す
          Get-ChildItem "$env:TRANSFER_LOCAL_ROOT\logs\desktop.log" -ErrorAction SilentlyContinue | Select-String -Pattern "START program|OPEN |READY |BACKEND " | ForEach-Object { Write-Host "TIMING $($_.Line)" }
          if (-not (Test-Path $env:TPA_SELFTEST)) { Write-Host "結果のファイルがありません"; exit 2 }
          $r = Get-Content $env:TPA_SELFTEST -Raw -Encoding utf8 | ConvertFrom-Json
          $r.results | ForEach-Object { Write-Host ("{0}: {1} -- {2}" -f ($(if ($_.ok) { "PASS" } else { "FAIL" })), $_.name, $_.info) }
          if ($r.error) { Write-Host "ERROR: $($r.error)" }
          Start-Sleep -Seconds 3
          if (Get-Process python -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "*hostedtoolcache*" }) { Write-Host "Python が残っています（窓を閉じても中身が終わっていない）"; exit 4 }
          if (-not $r.ok) { exit 1 }
      # 更新の通し（desktop/bundle/verify.py）: 共有から写る → 裏で取り込む → 次の起動で入れ替わる → 閉じている間に置いた版に 1 回の起動で入れ替わる → 壊れた版は控えへ戻す → 配る版を戻す
      - name: 更新の通し（本物の WebView2）
        run: python desktop\bundle\verify.py update --exe "desktop\target\release\$env:EXE" --work "$env:RUNNER_TEMP\verify"
      - name: 配る ZIP を作る
        run: python desktop\bundle\bundle.py build --exe "desktop\target\release\$env:EXE" --out "$env:RUNNER_TEMP\release"
      - name: 成果物をまとめる
        if: always()
        run: |
          $out = "$env:RUNNER_TEMP\out"
          New-Item -ItemType Directory -Force $out | Out-Null
          if (Test-Path "desktop\target\release\$env:EXE") { Copy-Item "desktop\target\release\$env:EXE" $out }
          if (Test-Path "$env:RUNNER_TEMP\selftest.json") { Copy-Item "$env:RUNNER_TEMP\selftest.json" $out }
          Get-ChildItem "$env:RUNNER_TEMP\release" -File -ErrorAction SilentlyContinue | Copy-Item -Destination $out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-windows
          path: ${{ runner.temp }}/out/
          if-no-files-found: warn

  # 確かめ終えた配る ZIP を GitHub の Releases に載せる（main だけ。PR では動かない）。説明はその版の更新履歴から作る（bundle.py notes）。
  # 2 つの仕事（windows-test・windows-exe）が両方通った後にだけ流れる（手で windows-test だけを選んだときは、windows-exe が流れないので流れない）。
  # 書き込みの権限はこの job にだけ渡す。同じ版の札が既にあれば上書きしない（版を上げずに入った変更。配った ZIP と指紋を変えない）。
  release:
    needs: [windows-test, windows-exe]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.18"
      - uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: out
      - name: Releases に載せる
        shell: bash
        run: |
          set -euo pipefail
          version=$(python desktop/bundle/bundle.py version)
          tag="v$version"
          read -r built zip < <(python -c 'import json; r = json.load(open("out/release.json", encoding="utf-8")); print(r["version"], r["zip"])')
          if [ "$built" != "$version" ]; then echo "::error::作った ZIP の版（$built）と program の版（$version）が違います"; exit 1; fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::warning::$tag は既に Releases にあります（上書きしません）。配る物を変えたときは版を上げてください。"
            exit 0
          fi
          python desktop/bundle/bundle.py notes --release out/release.json > notes.md
          gh release create "$tag" "out/$zip" "out/$zip.sha256" out/release.json \
            --target "$GITHUB_SHA" --title "版 $version" --notes-file notes.md --latest
